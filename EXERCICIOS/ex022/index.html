<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes de divs</title>
    <style>
        div{
            border: 1px solid black;
            border-radius: 50%;
        }
        
        div#div1{
            width: 500px;
            height: 500px;
            margin: auto;
        }

        div#div2{
            width: 250px;
            height: 250px;
        }

        div#div3{
            height: 125px;
            width: 125px;
        }
    </style>
</head>
<body>
    <h1>Testando as divs aninhadas</h1>

    <div id="div1">
        <div id="div2">
            <div id="div3">
                
            </div>
        </div>
    </div>
</body>
</html>
