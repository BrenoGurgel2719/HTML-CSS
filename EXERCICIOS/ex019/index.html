<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasses</title>
    <style>
       
       ul:hover{
        color: rgb(11, 165, 165);
       }
       div > ul{
            display: none;
        }
        div:hover > ul{
            display: block;
            background-color: brown;
            color: white;
            width: 100px;
        }
        div:hover{
            color: rgba(23, 155, 45, 0.788);
            background-color: brown;
            font-weight: bold;
            
        }

       
    </style>
</head>
<body>
    <h1>Welcome</h1>
    <p>Toque no texto abaixo para abrir menu</p>

    <div>Menu 
        <ul>
            <li>Home page</li>
            <li>End</li>
            <li>Store page</li>
            <li>Contact us</li>
        </ul>
    </div>
</body>
</html>
