<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Hambúrguer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    h1 {
      text-align: center;
      margin-top: 70px;
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #333;
      padding: 10px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      width: 1340px;
    }

    .hamburger {
      cursor: pointer;
      font-size: 24px;
      border: none;
      background: none;
      color: white;
    }

    .menu {
      position: absolute;
      top: 60px;
      right: 20px;
      background-color: #444;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      border-radius: 4px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.3s ease, max-height 0.3s ease;
    }

    .menu.show {
      opacity: 1;
      max-height: 500px; /* pode ajustar conforme o conteúdo */
    }

    .menu a {
      color: white;
      text-decoration: none;
      display: inline-block;
      padding: 5px 10px;
    }

    .menu a:hover {
      color: rgba(136, 116, 116, 0.486);
      background: #181616;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <span>Meu site</span>
    <button class="hamburger" id="btn-menu">&#9776;</button>
  </div>

  <nav class="menu" id="menu">
    <a href="#">Home</a>
    <a href="#">Notícias</a>
    <a href="#">Educação</a>
    <a href="#">Projetos</a>
    <a href="#">Doações</a>
  </nav>

  <h1>Menu Hambúrguer com Transição</h1>

  <script>
    const menu = document.getElementById("menu");
    const botao = document.getElementById("btn-menu");

    botao.addEventListener("click", () => {
      menu.classList.toggle("show");
    });
  </script>
</body>
</html>
