<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Analisando números</h1></header>

    <main>
        <article>
            <div>
                <h3>Número de 1 a 100: <input type="number" name="nu" id="nu"><button id="add">Adicionar</button></h3>
           </div>

           <div id="res">
                <button id="finish">Finalizar</button>
           </div>
        </article>
    </main>
    <footer>&copy;Breno_Gurgel</footer>

    <script>
        var botaoA = window.document.getElementById("add")
        var res = window.document.getElementById("res")
        var fim = window.document.getElementById("finish")

        botaoA.addEventListener("click", clicar);

        function clicar(){
          var n = Number(window.document.getElementById("nu").value)
        
          res.innerHTML+=`<br>O valor ${n} foi adicionado`
        }
    

       


        

    </script>
</body>
</html>
